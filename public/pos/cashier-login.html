<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/hello-kitty.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Kaffi · Cashier sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login" data-role="cashier" class="center">
<form id="loginForm" class="panel login">
  <h1>Hello Kaffi</h1><p class="muted">Cashier sign in</p>
  <input id="username" placeholder="Cashier username" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="btn" type="submit">Sign in as Cashier</button>
  <p id="err" class="err" role="alert"></p>
  <p class="muted small">Demo: cashier / cashier123</p>
  <p class="muted small"><a href="login.html">Back</a></p>
</form>
<script src="script.js"></script></body></html>
